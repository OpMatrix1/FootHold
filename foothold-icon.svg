<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14161F"/>
      <stop offset="100%" stop-color="#1E2130"/>
    </linearGradient>
    <linearGradient id="bars" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF7A45"/>
      <stop offset="100%" stop-color="#FFC85C"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#FF7A45" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- rounded square background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- subtle inner ring for depth -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="2"/>

  <!-- ascending steps forming a foothold mark -->
  <g filter="url(#soft)">
    <rect x="128" y="288" width="64" height="96" rx="16" fill="url(#bars)"/>
    <rect x="224" y="232" width="64" height="152" rx="16" fill="url(#bars)"/>
    <rect x="320" y="160" width="64" height="224" rx="16" fill="url(#bars)"/>
  </g>

  <!-- small marker dot at the peak, like a placed flag / landed point -->
  <circle cx="352" cy="140" r="14" fill="#FFC85C"/>
</svg>
